<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Warranty Claims</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand">Warranty Claims</a>

        <a href="/admin_dashboard" class="btn btn-light">
            Dashboard
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow" data-aos="zoom-in">

        <div class="card-header d-flex justify-content-between align-items-center">

            <h3 class="mb-0">All Warranty Claims</h3>

            <input
                type="text"
                id="searchInput"
                class="form-control w-25"
                placeholder="🔍 Search Anything">

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover" id="claimsTable">

                <thead class="table-dark">

                <tr>

                    <th>ID</th>
                    <th>User</th>
                    <th>Product</th>
                    <th>Reason</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

                </thead>

                <tbody>

                {% for claim in claims %}

                <tr>

                    <td>{{ claim[0] }}</td>
                    <td>{{ claim[1] }}</td>
                    <td>{{ claim[2] }}</td>
                    <td>{{ claim[3] }}</td>
                    <td>{{ claim[4] }}</td>
                    <td>{{ claim[5] }}</td>

                    <td>

                        <a href="/approve_claim/{{ claim[0] }}"
                           class="btn btn-success btn-sm">
                            Approve
                        </a>

                        <a href="/reject_claim/{{ claim[0] }}"
                           class="btn btn-danger btn-sm">
                            Reject
                        </a>

                    </td>

                </tr>

                {% endfor %}

                </tbody>

            </table>

            <a href="/admin_dashboard" class="btn btn-secondary">
                Back to Dashboard
            </a>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script>
AOS.init();
</script>

<script>
document.getElementById("searchInput").addEventListener("keyup", function () {

    let filter = this.value.toLowerCase();

    let rows = document.querySelectorAll("#claimsTable tbody tr");

    rows.forEach(function(row){

        let text = row.innerText.toLowerCase();

        if(text.includes(filter)){
            row.style.display = "";
        }else{
            row.style.display = "none";
        }

    });

});
</script>

</body>

</html>
